version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: legible
      POSTGRES_PASSWORD: legible_password
      POSTGRES_DB: legible
    ports:
      - "5432:5432"
    volumes:
      - legible_data:/var/lib/postgresql/data

volumes:
  # Pinned to the actual pre-existing volume by name, not derived from the
  # Compose project name — that derivation is what orphaned this data once
  # already (a project-name change after a Docker Desktop restart pointed a
  # fresh `up` at a brand-new empty volume instead of this one).
  legible_data:
    external: true
    name: project_legible_data
